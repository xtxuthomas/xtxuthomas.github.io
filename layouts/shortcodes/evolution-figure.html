{{- $image := printf "figures/binary-evolution/%s" (.Get "image") | relURL -}}
{{- $paper := .Get "paper" | default "https://arxiv.org/abs/2609.05128" -}}
<figure class="evolution-figure">
  <figcaption>{{ .Get "caption" }} | <a href="{{ $paper }}">related paper</a></figcaption>
  <a href="{{ $image }}"><img src="{{ $image }}" alt="{{ .Get "alt" }}" loading="lazy"></a>
</figure>
