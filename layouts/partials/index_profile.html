{{/* The profile comes from config.yml; the page body is ordinary Markdown. */}}
<div class="profile">
  {{ with site.Params.profileMode }}
  <div class="profile_inner">
    <img src="{{ .imageUrl | relURL }}" alt="Xiao-Tian Xu’s hedgehog profile image" width="160" height="160">
    <h1>{{ .title }}</h1>
    <p class="profile-subtitle">{{ .subtitle | markdownify }}</p>
    <p class="profile-websites"><a href="https://xiaotianxu-astro.github.io/">xiaotianxu-astro.github.io</a> · <a href="https://xtxuthomas.github.io/">https://xtxuthomas.github.io/</a></p>
  </div>
  {{ end }}
  <figure class="lbv-animation">
    <figcaption>LBV primary ejecting mass at periastron | <a href="https://doi.org/10.1051/0004-6361/202659877">related paper</a></figcaption>
    <picture>
      <source media="(prefers-reduced-motion: reduce)" srcset="{{ "figures/binary-evolution/lbv-periastron-still.png" | relURL }}">
      <img src="{{ "figures/binary-evolution/lbv-periastron.gif" | relURL }}"
           alt="An LBV primary and its companion orbit as the primary ejects mass near periastron."
           width="240" height="240">
    </picture>
  </figure>
</div>
<div class="home-tabs">
  <nav class="home-tabs-menu" aria-label="Homepage sections">
    {{ range site.Menus.main }}
    <a data-home-tab href="#{{ (urls.Parse .URL).Fragment }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <div class="post-content home-content">{{ .Content }}</div>
</div>
<script type="module" src="{{ "js/home-tabs.js" | relURL }}"></script>
