{{/* The profile comes from config.yml; the page body is ordinary Markdown. */}}
<div class="profile">
  {{ with site.Params.profileMode }}
  <div class="profile_inner">
    <img src="{{ .imageUrl | relURL }}" alt="Xiao-Tian Xu’s hedgehog profile image" width="160" height="160">
    <h1>{{ .title }}</h1>
    <p class="profile-subtitle">{{ .subtitle | markdownify }}</p>
  </div>
  {{ end }}
</div>
<div class="home-tabs">
  <nav class="home-tabs-menu" aria-label="Homepage sections">
    {{ range site.Menus.main }}
    <a data-home-tab href="#{{ (urls.Parse .URL).Fragment }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <div class="post-content home-content">{{ .Content }}</div>
</div>
<script type="module" src="{{ "js/home-tabs.js" | relURL }}"></script>
