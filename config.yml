baseURL: "https://xtxuthomas.github.io/" 
title: Xiao-Tian Xu's page
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

# Shared navigation for the homepage tabs and the inner-page menu.
menu:
    main:
        - name: About me
          url: "/#about-me"
          weight: 1
        - name: Research
          url: "/#research"
          weight: 2
        - name: Binary evolution illustration
          url: "/#binary-evolution-illustration"
          weight: 3
        - name: My Papers
          url: "/#my-papers"
          weight: 4
        - name: Interesting papers
          url: "/#interesting-papers"
          weight: 5
        - name: Codes and data
          url: "/#codes-and-data"
          weight: 6
        - name: Useful links
          url: "/#useful-links"
          weight: 7
        - name: Beyond research
          url: "/#beyond-research"
          weight: 8
        - name: Contact
          url: "/#contact"
          weight: 9

params:
    description: "Xiao-Tian Xu's personal page"
    author: Xiao-Tian Xu
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    #MainSections: ["Works","courses","papers","data"]
    ShowToc: false
    disableScrollToTop: false
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Xiao-Tian Xu (徐啸天)
          subtitle: "Astrophysics · Tsung-Dao Lee Institute, Shanghai Jiao Tong University"
          imageUrl: "picture.jpeg"
          imageWidth: 160
          imageHeight: 160

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Xiao-Tian Xu"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
