baseURL: "https://xtxuthomas.github.io/" 
title: Xiao-Tian Xu's page
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

# Navigation: add a name, URL, and weight to add another page.
menu:
    main:
        - name: Research
          url: research/
          weight: 1
        - name: Papers
          url: papers/
          weight: 2
        - name: Data
          url: data/
          weight: 4
        - name: Links
          url: links/
          weight: 5
        - name: Background
          url: about/
          weight: 6
        - name: Interesting papers
          url: reading/
          weight: 7

params:
    description: "Xiao-Tian Xu's personal page"
    author: Xiao-Tian Xu
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    #MainSections: ["Works","courses","papers","data"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Xiao-Tian Xu (徐啸天)
          subtitle: "Astrophysics · Tsung-Dao Lee Institute, Shanghai Jiao Tong University"
          imageUrl: "picture.jpeg"
          imageWidth: 160
          imageHeight: 160
          # The short row of buttons beneath your name.
          buttons:
            - name: Research
              url: research/
            - name: Papers
              url: papers/
            - name: Interesting papers
              url: reading/
            - name: Data
              url: data/
            - name: Useful links
              url: links/

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Xiao-Tian Xu"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
